name: mi_academy
description: MI Academy — Free educational games for children aged 5-12
version: 0.9.0-beta.2+2
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Local packages
  mi_game_core:
    path: ../../packages/mi_game_core
  mi_game_ui:
    path: ../../packages/mi_game_ui
  mi_game_content:
    path: ../../packages/mi_game_content
  mi_game_audio:
    path: ../../packages/mi_game_audio
  mi_game_progress:
    path: ../../packages/mi_game_progress
  mi_game_accessibility:
    path: ../../packages/mi_game_accessibility
  mi_blocks:
    path: ../../packages/mi_blocks
  design_system:
    path: ../../packages/design_system
  localization:
    path: ../../packages/localization
  progress_core:
    path: ../../packages/progress_core
  offline_sync:
    path: ../../packages/offline_sync
  mastery_core:
    path: ../../packages/mastery_core
  recommendation_core:
    path: ../../packages/recommendation_core

  # Networking
  dio: ^5.4.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # State management
  flutter_riverpod: ^2.5.0

  # Routing
  go_router: ^14.0.0

  # Auth & Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.0
  intl: ^0.20.2
  connectivity_plus: ^6.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mi_game_testing:
    path: ../../packages/mi_game_testing

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/levels/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 800
    - family: NunitoRounded
      fonts:
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-VariableFont_wght.ttf
          weight: 800
