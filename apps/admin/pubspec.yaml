version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  shared_models:
    path: ../../packages/shared_models
  design_system:
    path: ../../packages/design_system
  localization:
    path: ../../packages/localization
  dio: ^5.4.0
  flutter_riverpod: ^2.5.0
