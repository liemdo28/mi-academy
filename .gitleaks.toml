# Gitleaks config for MI Academy.
#
# Extends the default ruleset (gitleaks scans full git history by default,
# so a false-positive match in an old commit can't be fixed by editing the
# file forward -- it must be allowlisted here instead of rewriting history).

[extend]
useDefault = true

[allowlist]
description = "Confirmed false positives -- not real secrets"
# apps/mobile/test/beta_diagnostics_test.dart @ this exact commit used a
# plausible-looking-but-fake token fixture ("abc123.def456") to verify
# BetaDiagnostics' redaction logic actually scrubs token-shaped values
# before they're ever stored. Gitleaks' generic-api-key entropy heuristic
# flagged it (Fingerprint:
# 83d22d0c9771f2c2709f64dcde1b34c0438d44a0:apps/mobile/test/beta_diagnostics_test.dart:generic-api-key:29).
# Confirmed by reading the file directly at the flagged commit/line: not a
# real credential. Superseded by an even-more-obviously-fake fixture
# string in a later commit, but the original commit remains in history
# (rewriting history to remove it would be a separate, more destructive
# action), so allowlisting the specific commit is the correct fix.
commits = [
  "83d22d0c9771f2c2709f64dcde1b34c0438d44a0",
]
