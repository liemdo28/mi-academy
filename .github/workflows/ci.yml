name: MI Academy CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"
  PYTHON_VERSION: "3.13"

jobs:
  content-and-safety:
    name: Content and child-safety gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate MVP content
        run: python tools/content_validator/validate_content.py

      - name: Verify MVP levels are solvable
        run: python tools/level_validator/solve_levels.py

      - name: Audit child-facing level content
        run: python tools/content_safety_audit.py --json

      - name: Verify game code is offline-only
        run: python tools/game_network_audit.py --json

      - name: Run static child-safety audit
        run: python tools/child_safety_audit.py --json

      - name: Audit mobile platform privacy surfaces
        run: python tools/mobile_platform_privacy_audit.py --json

      - name: Generate child-safety pre-signoff evidence
        run: python tools/child_safety_signoff.py --json

  security-scans:
    name: Secret, dependency, and SAST scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scan tooling
        run: python -m pip install --upgrade pip pip-audit bandit cyclonedx-bom

      - name: Python dependency vulnerability scan (report-only)
        # Non-blocking while the team triages findings — see docs/security/SECURITY_BASELINE.md.
        # Promote to blocking once a Critical/High triage owner is assigned.
        continue-on-error: true
        run: python -m pip_audit -r apps/api/requirements.txt

      - name: Python SAST scan (report-only)
        continue-on-error: true
        run: python -m bandit -r apps/api -x apps/api/alembic --severity-level medium

      - name: Generate backend SBOM
        run: |
          mkdir -p reports
          python -m cyclonedx_py requirements apps/api/requirements.txt -o reports/sbom-api-${{ github.sha }}.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-api-${{ github.sha }}
          path: reports/sbom-api-${{ github.sha }}.json

  python-tests:
    name: Python game-core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        # apps/api/requirements.txt already pins pytest/pytest-asyncio/aiosqlite
        # alongside fastapi/sqlalchemy/starlette etc. Installing only a
        # hand-picked subset here (as this job previously did) meant every
        # test importing the actual backend app failed to collect with
        # ModuleNotFoundError -- but the failure was masked because this
        # workflow never scheduled a job before (see the CI-fix commit that
        # touched android-release-signing's `if:`).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt

      - name: Debug release evidence gate breakdown
        run: python tools/release_evidence.py --json

      - name: Run Python tests
        run: python -m pytest packages/game_core/tests tests test -q

  mobile-test-build:
    name: Mobile analyze, tests, web, and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze mobile app
        run: flutter analyze

      - name: Run mobile widget tests
        run: flutter test

      - name: Upload golden test failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/mobile/test/failures/
          if-no-files-found: ignore

      - name: Build web release
        run: flutter build web --release

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Record artifact-size baseline
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p reports
          python tools/performance_baseline.py --json > reports/performance-baseline.json

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-academy-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: mi-academy-web-build
          path: apps/mobile/build/web

      - name: Upload performance baseline
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: reports/performance-baseline.json

  ios-build:
    name: iOS no-codesign build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS without codesigning
        run: flutter build ios --debug --no-codesign

  android-release-signing:
    name: Android release build (signed)
    # No-op until ANDROID_KEYSTORE_BASE64 is configured as a repo secret —
    # see docs/security/SECRET_INVENTORY.md. Nothing is uploaded to Play
    # Store here; this only produces a signed .aab + mapping file artifact
    # for manual upload until a Play Store publishing step is added.
    #
    # NOTE: the secret-presence check is deliberately a step-level `if`,
    # not a job-level `if`. The `secrets` context is not reliably usable in
    # a job-level `if` — using it there caused every CI run on this
    # workflow to fail before any job was scheduled (visible as "This run
    # likely failed because of a workflow file issue" with zero jobs).
    runs-on: ubuntu-latest
    needs: mobile-test-build
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check release signing secret is configured
        id: check-secret
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check-secret.outputs.configured == 'true'

      - uses: actions/setup-java@v4
        if: steps.check-secret.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        if: steps.check-secret.outputs.configured == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        if: steps.check-secret.outputs.configured == 'true'
        run: flutter pub get

      - name: Decode release keystore
        if: steps.check-secret.outputs.configured == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<KEYPROPS
          storeFile=app/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYPROPS

      - name: Build signed app bundle
        if: steps.check-secret.outputs.configured == 'true'
        run: flutter build appbundle --release

      - name: Upload signed app bundle + mapping file
        if: steps.check-secret.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mi-academy-release-aab
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/mapping/release/mapping.txt

      - name: Remove decoded keystore
        if: always() && steps.check-secret.outputs.configured == 'true'
        run: rm -f android/app/release.jks android/key.properties
