name: api_client
description: Unified API client for MI Academy — single entry point wrapping game_sdk, content_sdk, analytics_sdk, and adaptive_sdk.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  game_sdk:
    path: ../game_sdk
  content_sdk:
    path: ../content_sdk
  analytics_sdk:
    path: ../analytics_sdk
  adaptive_sdk:
    path: ../adaptive_sdk
  http: ^1.1.0
  json_annotation: ^4.8.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  mockito: ^5.4.0
