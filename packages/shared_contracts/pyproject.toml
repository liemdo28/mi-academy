[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mi-shared-contracts"
version = "1.0.0"
description = "MI Academy shared contracts — OpenAPI spec and JSON schemas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
dev-dependencies = ["pyyaml", "openapi-spec-validator>=0.7"]

[project.scripts]
mi-contracts = "shared_contracts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["shared_contracts"]]
