name: mi_game_ui
description: Shared UI widgets for MI Academy games (header, pause, hint, feedback, completion, etc.)
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  mi_game_core:
    path: ../mi_game_core
  design_system:
    path: ../design_system
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
